spring.datasource.url=jdbc:h2:mem:tiendadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123  
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Habilitar consola H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Generar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update

# AGREGADO: Integración con AWS Cognito (Reemplaza con el Pool ID que te dio/dé el profesor)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.us-east-1.amazonaws.com/us-east-1_XXXXXXXXX