spring.datasource.url=jdbc:h2:mem:tiendadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=123

# Habilitar consola H2 en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Generar tablas automaticamente
spring.jpa.hibernate.ddl-auto=update

# ---------------- Cognito ----------------
# Formato: ${VARIABLE_DE_ENTORNO:valor_por_defecto}
# Cuando tengamos los IDs reales se escriben DESPUES de los dos puntos.
# (Los IDs de pool y de App Client no son secretos: viajan dentro de cada token.)
app.cognito.region=us-east-1

# Pool CLIENTES (frontend tienda) -> rol CLIENTE (solo lectura)
app.cognito.pool-clientes-id=${COGNITO_POOL_CLIENTES_ID:us-east-1_i6IxeWTTP}
app.cognito.client-id-clientes=${COGNITO_CLIENT_ID_CLIENTES:7lkdnlk9b4s6tldgfkd9sotodj}

# Pool PERSONAL (frontend admin) -> rol PERSONAL (lectura y escritura)
app.cognito.pool-personal-id=${COGNITO_POOL_PERSONAL_ID:us-east-1_DiJQNqIk8}
app.cognito.client-id-personal=${COGNITO_CLIENT_ID_PERSONAL:o8dldolr0m5un8c1i37r9f5ej}

# Frontends que pueden llamar a la API (CORS)
app.cors.origenes=http://localhost:5173,http://localhost:5174